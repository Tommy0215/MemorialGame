<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>My Three.js Multiplayer Game</title>
    <style>
      body { margin: 0; overflow: hidden; }
      canvas { display: block; }
      #coordinates {
        position: absolute;
        top: 10px;
        left: 10px;
        color: white;
        font-family: monospace;
        font-size: 14px;
        background: rgba(0, 0, 0, 0.5);
        padding: 10px;
        border-radius: 4px;
        pointer-events: none;
        display: none;
      }
      #crosshair {
        position: fixed;
        top: 50%;
        left: 50%;
        width: 24px;
        height: 24px;
        transform: translate(-50%, -50%);
        pointer-events: none;
        z-index: 20;
      }
      #crosshair::before,
      #crosshair::after {
        content: "";
        position: absolute;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 0 2px rgba(0, 0, 0, 0.9);
      }
      #crosshair::before {
        left: 50%;
        top: 2px;
        width: 2px;
        height: 20px;
        transform: translateX(-50%);
      }
      #crosshair::after {
        left: 2px;
        top: 50%;
        width: 20px;
        height: 2px;
        transform: translateY(-50%);
      }
      #toolbar {
        position: fixed;
        left: 50%;
        bottom: 22px;
        transform: translateX(-50%);
        display: flex;
        gap: 10px;
        z-index: 25;
        pointer-events: none;
      }
      .toolbar-slot {
        width: 64px;
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 10px;
        border: 2px solid rgba(255, 255, 255, 0.35);
        background: rgba(12, 12, 12, 0.55);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
      }
      .toolbar-slot.active {
        border-color: #ffd95e;
        box-shadow:
          0 0 0 2px rgba(255, 217, 94, 0.25),
          0 6px 18px rgba(0, 0, 0, 0.45);
      }
      .toolbar-slot.has-item {
        background: rgba(30, 30, 30, 0.85);
      }
      .slot-icon {
        width: 36px;
        height: 36px;
        object-fit: contain;
        image-rendering: auto;
        filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.5));
      }
    </style>
  </head>
  <body>
    <!-- Your game will append the canvas here -->
    <div id="crosshair"></div>
    <div id="toolbar" aria-hidden="true">
      <div id="slot-1" class="toolbar-slot active" data-key="1"></div>
      <div id="slot-2" class="toolbar-slot" data-key="2"></div>
    </div>
    <div id="coordinates"></div>
    
    <!-- Main game script -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
